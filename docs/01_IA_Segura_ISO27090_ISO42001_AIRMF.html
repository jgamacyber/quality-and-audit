<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Segura — ISO 27090, ISO 42001 e NIST AI RMF · Quality &amp; Audit</title>
<style>
:root{
  --ink:#0B1B2B; --muted:#5B6878; --soft:#8794A3; --bg:#F2F5F7; --card:#FFFFFF; --line:#E1E7ED; --line2:#CBD5DF;
  --brand:#0E7490; --brand-d:#155E75; --brand-soft:#E3F3F6; --night:#0A2230; --glow:#5EEAD4;
  --c:#15803D; --c-b:#DCFCE7; --p:#B45309; --p-b:#FEF3C7; --nc:#B91C1C; --nc-b:#FEE2E2; --na:#475569; --na-b:#E2E8F0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3,h4{letter-spacing:-.015em;line-height:1.15}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* topo */
.top{position:sticky;top:0;z-index:30;background:var(--night);color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
.top-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;background:none;border:0;padding:0}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--glow);border-left:1px solid rgba(255,255,255,.18);padding-left:10px}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{background:none;border:0;color:#A9BDC9;font-weight:650;font-size:14px;padding:9px 12px;border-radius:9px}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button.on{color:#fff;background:rgba(94,234,212,.14)}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#A9BDC9}
.prog .bar{width:110px;height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--glow)}
.prog b{color:#fff}

.wrap{max-width:1360px;margin:0 auto;padding:28px 24px 90px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;line-height:1;white-space:nowrap;text-decoration:none}
.btn-pri{background:#14B8A6;color:#032A2C}
.btn-pri:hover{background:#2DD4BF}
.btn-line{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
.btn-line:hover{background:rgba(255,255,255,.07)}
.btn-sec{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn-sec:hover{border-color:var(--brand);color:var(--brand)}
.btn-dark{background:var(--brand);color:#fff}
.btn-dark:hover{background:var(--brand-d)}
.btn-red{background:#fff;border-color:#F3B4B4;color:var(--nc)}
.btn-sm{padding:8px 12px;font-size:13px}

/* início */
.hero{background:var(--night);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(94,234,212,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(110deg,transparent 30%,#000 75%);-webkit-mask-image:linear-gradient(110deg,transparent 30%,#000 75%)}
.hero-in{position:relative;max-width:1360px;margin:0 auto;padding:64px 24px 70px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.kick{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--glow)}
.hero h1{font-size:clamp(34px,4.8vw,58px);margin:16px 0 0;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--glow)}
.hero p.lead{max-width:620px;color:#B9CCD6;font-size:17px;line-height:1.7;margin:20px 0 0}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px}
.hero-card .row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.hero-card .row:last-child{border-bottom:0}
.hero-card .row span{color:#B9CCD6;font-size:14px}
.hero-card .row b{font-size:24px;font-weight:800}
@media (max-width:900px){.hero-in{grid-template-columns:1fr;padding:44px 16px 48px}}

.sec{margin:44px 0 0}
.sec-h{display:flex;align-items:center;gap:14px;margin:0 0 18px}
.sec-h .n{font-weight:800;color:var(--brand);font-size:13px}
.sec-h .ln{width:30px;height:1px;background:var(--line2)}
.sec-h h2{margin:0;font-size:21px}
.sec-h p{margin:0 0 0 auto;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;padding:22px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.f.wide{grid-column:1/-1}
.f small{font-weight:500;color:var(--muted);font-size:12.5px;line-height:1.45}
input[type=text],input[type=date],textarea,select{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#fff;font-size:14.5px;font-weight:500}
textarea{min-height:74px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,116,144,.14)}
.norms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.norm{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.norm.on{border-color:var(--nc-color,var(--brand));box-shadow:0 14px 30px -22px rgba(10,34,48,.5)}
.norm .chk{position:absolute;top:18px;right:18px;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900}
.norm.on .chk{background:var(--nc-color,var(--brand));border-color:var(--nc-color,var(--brand))}
.norm .code{font-weight:800;font-size:13px}
.norm h3{margin:0;font-size:19px;padding-right:30px}
.norm p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.norm .meta{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:16px;font-size:13px;color:var(--muted)}
.norm .meta b{color:var(--ink)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.how .card{padding:20px}
.how .num{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:14px}
.how h3{margin:12px 0 6px;font-size:16px}
.how p{margin:0;color:var(--muted);font-size:14px}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.about{grid-template-columns:1fr}}
.about .card{padding:22px}
.ref{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.ref:last-child{border-bottom:0}
.ref .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ref b{font-size:15px}
.pill{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand)}
.ref span.d{color:var(--muted);font-size:13.5px}
.notes p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.65}
.data-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 22px}
.data-row .sp{flex:1}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* auditoria */
.aud{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;align-items:start}
.rail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.rail .g{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:12px 8px 6px;display:flex;align-items:center;gap:8px}
.rail .g i{width:8px;height:8px;border-radius:3px;display:inline-block}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;font-size:13.5px}
.rail button:hover{background:#F4F7F9}
.rail button.on{background:var(--brand-soft)}
.rail .k{min-width:42px;font-weight:800;font-size:12px;color:var(--muted)}
.rail button.on .k{color:var(--brand)}
.rail .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .c{font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.rail .c.ok{color:var(--c);font-weight:800}
.railsel{display:none}
@media (max-width:980px){.aud{grid-template-columns:1fr}.rail{display:none}.railsel{display:block;margin-bottom:14px}}
.stephead{padding:22px 24px;margin-bottom:16px}
.stephead .top2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.stephead h2{margin:8px 0 6px;font-size:26px}
.stephead p{margin:0;color:var(--muted)}
.pbar{height:6px;border-radius:99px;background:#EAF0F3;overflow:hidden;margin-top:16px}
.pbar span{display:block;height:100%;background:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:650}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.items{display:flex;flex-direction:column;gap:14px}
.item{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:var(--r);padding:20px 22px}
.item.C{border-left-color:var(--c)}.item.P{border-left-color:var(--p)}.item.NC{border-left-color:var(--nc)}.item.NA{border-left-color:var(--na)}
.it-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.rf{font-weight:800;font-size:12px;padding:4px 8px;border-radius:7px;white-space:nowrap}
.it-top h3{margin:0;font-size:17px;flex:1;min-width:200px}
.q{margin:8px 0 0;color:#3A4757;font-size:15px;line-height:1.6}
.xref{display:inline-flex;gap:7px;align-items:flex-start;margin-top:10px;font-size:12.5px;font-weight:650;color:#155E75;background:#ECFEFF;border:1px solid #CFFAFE;padding:6px 10px;border-radius:9px;line-height:1.45}
.ctl{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-top:16px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:750}
.seg button:hover{border-color:var(--ink)}
.seg button.on-C{background:var(--c);border-color:var(--c);color:#fff}
.seg button.on-P{background:var(--p);border-color:var(--p);color:#fff}
.seg button.on-NC{background:var(--nc);border-color:var(--nc);color:#fff}
.seg button.on-NA{background:var(--na);border-color:var(--na);color:#fff}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mat button{width:36px;padding:8px 0}
.matd{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:14px}
.fields textarea{min-height:64px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:700;font-size:13px}
.guide{margin-top:14px;background:#F7FAFB;border:1px dashed var(--line2);border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.guide h4{margin:0 0 3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.guide p{margin:0;font-size:14px;color:#334155}
.sevnote{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:520px}
.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}

/* plano */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:980px){.kb{grid-template-columns:1fr}}
.col{background:#E7EDF1;border-radius:16px;padding:12px;min-height:240px;transition:outline-color .15s}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 12px;font-weight:800;font-size:14px}
.col-h span{font-size:12px;background:#fff;border-radius:99px;padding:2px 9px;color:var(--muted)}
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:grab}
.kc:active{cursor:grabbing}
.kc .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.kc h4{margin:8px 0 6px;font-size:14.5px;line-height:1.35}
.kc .m{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.kc .late{color:var(--nc);font-weight:800}
.kc .mv{display:flex;gap:6px;margin-top:10px}
.kc .mv button{border:1px solid var(--line2);background:#fff;border-radius:8px;font-size:12px;padding:4px 8px;font-weight:700}
.tag{font-weight:800;font-size:11px;padding:3px 8px;border-radius:99px}
.t-maj{background:var(--nc);color:#fff}.t-men{background:var(--nc-b);color:var(--nc)}.t-par{background:var(--p-b);color:var(--p)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}

/* painel */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.dgrid .card{padding:22px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s6{grid-column:span 6}.s12{grid-column:span 12}
@media (max-width:1000px){.s4,.s5,.s7,.s8,.s6{grid-column:span 12}}
.card h3.ct{margin:0 0 4px;font-size:16px}
.card .cs{margin:0 0 16px;color:var(--muted);font-size:13px}
.ringw{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.verd b{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;color:#fff}
.verd p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:340px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:6px 12px;align-items:center;margin-bottom:12px}
.hb .l{font-size:13.5px;font-weight:650;display:flex;justify-content:space-between;gap:8px}
.hb .l small{color:var(--muted);font-weight:500}
.hb .tr{grid-column:1/2;height:8px;background:#EDF2F5;border-radius:99px;overflow:hidden}
.hb .tr span{display:block;height:100%;border-radius:99px}
.hb .v{grid-column:2;grid-row:1/3;text-align:right;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hc{border:0;border-radius:11px;padding:10px 12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.hc small{font-size:11px;font-weight:800;opacity:.85}
.hc span{font-size:12.5px;font-weight:650;line-height:1.3}
.hc b{font-size:18px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#EDF2F5}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.flist{display:flex;flex-direction:column}
.fl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fl:last-child{border-bottom:0}
.fl .tt{min-width:0}
.fl .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .tt small{color:var(--muted)}

/* relatórios */
.rtool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.rtool .sp{flex:1}
.rtool p{margin:0;color:var(--muted);font-size:13.5px}
.pscroll{overflow-x:auto;padding-bottom:12px}
.pages{display:flex;flex-direction:column;align-items:center;gap:26px;min-width:min-content}
.page{width:210mm;height:297mm;background:#fff;box-shadow:0 18px 40px -24px rgba(10,34,48,.45);position:relative;overflow:hidden;padding:18mm 17mm 20mm;color:#0B1B2B;font-size:9.6pt;line-height:1.5}
.page .ph{display:flex;justify-content:space-between;align-items:center;padding-bottom:4mm;border-bottom:1px solid #E1E7ED;font-size:8pt;color:#5B6878;margin-bottom:8mm}
.page .ph .bm{display:flex;align-items:center;gap:7px;font-weight:800;color:#0B1B2B;font-size:9pt}
.page .pf{position:absolute;left:17mm;right:17mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7.6pt;color:#8794A3;border-top:1px solid #E1E7ED;padding-top:3mm}
.page h2{font-size:17pt;margin:2mm 0 6mm;letter-spacing:-.02em}
.page .kk{font-size:7.6pt;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#0E7490}
.page table{width:100%;border-collapse:collapse;font-size:8.6pt}
.page th{text-align:left;font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:#5B6878;border-bottom:1.4px solid #0B1B2B;padding:2mm 1.5mm}
.page td{border-bottom:1px solid #EDF1F4;padding:1.9mm 1.5mm;vertical-align:top}
.page td.n,.page th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.page .cut{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover{padding:0}
.cover .band{background:#0A2230;color:#fff;padding:22mm 18mm 18mm;height:150mm;position:relative;overflow:hidden}
.cover .band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(94,234,212,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.09) 1px,transparent 1px);background-size:9mm 9mm}
.cover .band>*{position:relative}
.cover .bm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11pt}
.cover h1{font-size:30pt;margin:34mm 0 4mm;letter-spacing:-.03em;line-height:1.05}
.cover .sub{color:#B9CCD6;font-size:12pt}
.cover .meta{padding:14mm 18mm;display:grid;grid-template-columns:1fr 1fr;gap:7mm 10mm}
.cover .meta div small{display:block;font-size:7.4pt;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8794A3;margin-bottom:1.5mm}
.cover .meta div b{font-size:11pt}
.cover .conf{position:absolute;left:18mm;right:18mm;bottom:12mm;font-size:8pt;color:#8794A3;border-top:1px solid #E1E7ED;padding-top:3mm}
.rbig{display:grid;grid-template-columns:auto 1fr;gap:8mm;align-items:center;margin-bottom:8mm}
.rk{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin-bottom:8mm}
.rk div{border:1px solid #E1E7ED;border-radius:3mm;padding:3mm}
.rk b{display:block;font-size:15pt}
.rk span{font-size:7.4pt;color:#5B6878}
.rbar{height:2.4mm;border-radius:99px;background:#EDF2F5;overflow:hidden}
.rbar span{display:block;height:100%}
.fcard{border:1px solid #E1E7ED;border-radius:3mm;padding:4mm 5mm;margin-bottom:4mm;break-inside:avoid}

<script id="deck-data" type="application/json">{"id": "ia-segura", "title": "IA Segura — ISO 27090, ISO 42001 e NIST AI RMF", "tag": "IA Segura", "h1": "Auditoria de IA com ISO 27090, ISO 42001 e NIST AI RMF,", "lead": "Governança do sistema de gestão de IA, ameaças específicas a modelos e dados e as funções Govern, Map, Measure e Manage numa única auditoria.", "norms": [{"id": "27090", "code": "ISO/IEC 27090:2026", "short": "ISO 27090", "name": "Segurança de sistemas de IA", "desc": "Orientações para detectar e mitigar ameaças específicas a sistemas de IA ao longo do ciclo de vida. Norma de orientação, não certificável.", "color": "#4F46E5", "light": "#C7C9FA", "ink": "#4338CA", "steps": [{"k": "5.2", "t": "Governança, zero trust e engenharia", "d": "Cláusulas 5.2 a 5.4 · aplicação da segurança da informação a sistemas de IA.", "i": [["5.2 a", "Programa de governança de IA", "Existe um programa de governança de IA que inclui a segurança dos sistemas de IA, com papéis, políticas e aprovação de novos casos de uso?", "Segurança participa da aprovação de casos de uso de IA; papéis definidos entre cibersegurança, ciência de dados, dados e compras; política de uso de IA publicada.", "Política de IA, ata do comitê de IA, fluxo de aprovação de casos de uso, matriz RACI.", "42001 5.2 · A.3.2 · AI RMF GOVERN 1.2"], ["5.2 b", "Inventário de sistemas e ativos de IA", "A organização mantém inventário dos sistemas de IA e dos ativos que precisam de proteção: dados de treino, modelos, pesos, prompts de sistema, pipelines e serviços de terceiros?", "Inventário atualizado com finalidade, dono, fornecedor, criticidade e localização dos artefatos; inclui SaaS com IA, copilotos e APIs de modelos.", "Inventário de IA, registro de modelos (model registry), lista de fornecedores de IA.", "42001 A.4.2 · AI RMF GOVERN 1.6"], ["5.3", "Princípios de zero trust", "Os sistemas de IA seguem princípios de zero trust: identidade forte para usuários, serviços e agentes, menor privilégio e verificação contínua?", "Modelos e agentes usam identidades próprias com permissões mínimas; nenhuma confiança implícita em entradas, ferramentas ou rede interna; acesso às APIs de modelo autenticado.", "Configuração de IAM das contas de serviço, política de acesso às APIs de IA, diagrama de arquitetura.", "AI RMF MEASURE 2.7"], ["5.4", "Engenharia de software aplicada à IA", "O desenvolvimento de IA segue práticas de engenharia segura: versionamento de código, dados e modelos, revisão, testes e pipeline de MLOps protegido?", "Dados e modelos versionados; mudanças revisadas; testes de segurança no pipeline; segregação entre desenvolvimento e produção; segredos fora do código e dos notebooks.", "Repositório, pipeline de CI/CD de ML, política de SDL, registros de revisão.", "27001 A.8.25 · AI RMF MEASURE 2.1"]]}, {"k": "5.5", "t": "Cadeia de suprimentos de IA", "d": "Cláusula 5.5 · ameaças, vetores e mitigação na cadeia de suprimentos de dados e modelos.", "i": [["5.5.2", "Ameaças específicas da cadeia de IA", "Os riscos da cadeia de suprimentos de IA foram identificados, como modelos pré-treinados com backdoor, datasets públicos envenenados e formatos de serialização inseguros?", "Lista de componentes externos (modelos base, datasets, bibliotecas, APIs) com riscos avaliados; atenção a artefatos que executam código ao serem carregados.", "Avaliação de riscos de terceiros, lista de modelos e datasets externos, análise de riscos.", "42001 A.10.3 · AI RMF GOVERN 6.1"], ["5.5.3", "Cadeias complexas de IA", "As cadeias complexas estão mapeadas, com responsabilidades claras entre provedor do modelo base, quem faz fine-tuning, quem integra e quem opera?", "Mapa da cadeia (modelo base, fine-tuning, RAG, plugins, provedores de API) com responsabilidades de segurança atribuídas e refletidas em contrato.", "Diagrama da cadeia, contratos, matriz de responsabilidades compartilhadas.", "AI RMF MAP 4.1"], ["5.5.4", "Vetores de ataque específicos", "Os vetores conhecidos são tratados, como repositórios públicos de modelos, pacotes de ML falsificados (typosquatting) e notebooks compartilhados?", "Fontes de modelos e pacotes restritas a repositórios aprovados; espelho interno; verificação de dependências; proibição de carregar modelos não verificados em produção.", "Política de fontes aprovadas, configuração do proxy de pacotes, relatório de varredura de dependências.", "27001 A.8.8"], ["5.5.5", "Mitigação na cadeia de suprimentos", "Há controles como inventário de componentes de IA (AI-BOM), verificação de hash ou assinatura de modelos, varredura de artefatos e avaliação de fornecedores?", "Modelos e datasets verificados antes do uso; formatos seguros de pesos; fornecedores de IA avaliados e com cláusulas de segurança, incidentes e uso de dados.", "AI-BOM, registros de verificação de integridade, avaliações de fornecedores, contratos.", "42001 A.10.3 · AI RMF MANAGE 3.1–3.2"]]}, {"k": "5.6", "t": "Modelagem de ameaças e red teaming", "d": "Cláusulas 5.6 e 5.7 · antecipar ataques e testar o sistema como um adversário.", "i": [["5.6", "Modelagem de ameaças de IA", "Existe modelagem de ameaças específica para cada sistema de IA relevante, atualizada quando o sistema muda?", "Ameaças da cláusula 6 consideradas (envenenamento, evasão, inferência, exfiltração, injeção de prompt); uso de referências como MITRE ATLAS e OWASP Top 10 para LLM; revisão a cada mudança relevante.", "Documento de threat model, diagrama de fluxo de dados, histórico de revisões.", "42001 6.1.2 · AI RMF MAP 5.1"], ["5.7 a", "Red teaming de IA", "A organização realiza red teaming dos sistemas de IA com escopo, regras de engajamento e cenários definidos?", "Exercícios periódicos e antes de lançamentos relevantes; cenários de jailbreak, injeção de prompt, extração de dados e evasão; equipe independente ou externa quando o risco é alto.", "Plano de red team, relatório do exercício, regras de engajamento.", "AI RMF MEASURE 1.3 · MEASURE 2.7"], ["5.7 b", "Tratamento dos resultados do red team", "Os achados de red teaming são rastreados até a correção e retestados?", "Achados registrados com severidade, dono e prazo; reteste comprovado; lições incorporadas à modelagem de ameaças e aos testes automatizados.", "Backlog de achados, evidência de reteste, atualização do threat model.", "AI RMF MANAGE 1.3"]]}, {"k": "6.2", "t": "Envenenamento de dados e evasão", "d": "Cláusula 6 · ataques contra os dados de treino e contra as entradas em produção.", "i": [["6.2.3", "Detecção de envenenamento de dados", "Há mecanismos para detectar envenenamento nos dados de treino e retreino, inclusive nos dados coletados durante a operação?", "Validação estatística e de esquema dos dados, detecção de outliers, comparação com versões anteriores, revisão de dados vindos de usuários antes de entrarem no retreino.", "Relatórios de validação de dados, regras do pipeline, registros de curadoria.", "42001 A.7.4 · AI RMF MEASURE 2.1"], ["6.2.4", "Mitigação de envenenamento de dados", "Os datasets são protegidos contra alteração e o retreino exige aprovação?", "Acesso de escrita restrito aos datasets; integridade verificada; sanitização e deduplicação; retreino só com aprovação e com comparação de desempenho e comportamento.", "Permissões dos repositórios de dados, hashes, aprovação de retreino, relatórios de avaliação.", "42001 A.7.5"], ["6.3.3", "Detecção de ataques de evasão", "O sistema monitora entradas que buscam enganar o modelo, como perturbações adversariais ou padrões de confiança anormais?", "Monitoramento da distribuição das entradas e das saídas; alertas para quedas de confiança ou mudanças bruscas; amostras suspeitas enviadas para análise.", "Painel de monitoramento do modelo, regras de alerta, casos analisados.", "AI RMF MEASURE 2.4"], ["6.3.4", "Mitigação de ataques de evasão", "A robustez do modelo contra evasão é testada antes do deploy e reforçada quando necessário?", "Testes de robustez adversarial documentados; técnicas como treinamento adversarial ou pré-processamento das entradas; revisão humana para decisões de alto impacto.", "Relatórios de testes de robustez, critérios de aceite, desenho do fluxo de revisão humana.", "AI RMF MEASURE 2.5–2.7"]]}, {"k": "6.4", "t": "Inferência, exfiltração e adulteração", "d": "Cláusula 6 · ataques à confidencialidade dos dados de treino e à integridade do modelo.", "i": [["6.4", "Inferência de pertencimento", "Para modelos treinados com dados pessoais ou sigilosos, o risco de alguém descobrir se um registro fez parte do treino foi avaliado e tratado?", "Avaliação documentada; mitigação com regularização, privacidade diferencial ou redução da informação exposta (por exemplo, não devolver probabilidades detalhadas).", "Avaliação de privacidade do modelo, resultados de testes de inferência, configuração da API.", "27701 A.1.4.5 · AI RMF MEASURE 2.10"], ["6.5", "Exfiltração de modelo", "Há proteção contra roubo do modelo, tanto por acesso direto aos pesos quanto por grande volume de consultas aparentemente legítimas?", "Pesos criptografados e com acesso restrito; limites de taxa; monitoramento de padrões de consulta típicos de extração; marcas d’água quando aplicável.", "Controles de acesso ao armazenamento de pesos, configuração de rate limit, alertas de abuso.", "AI RMF MEASURE 2.7"], ["6.6", "Inversão de modelo", "O risco de reconstruir dados de treino a partir das saídas do modelo foi avaliado?", "Minimização dos dados sensíveis no treino; limitação do detalhe das saídas; testes de extração e memorização, principalmente em modelos generativos.", "Relatórios de testes de memorização, decisões de minimização, avaliação de impacto.", "AI RMF MEASURE 2.10"], ["6.7", "Envenenamento direto do modelo", "A integridade dos artefatos do modelo é protegida contra alteração de pesos ou inserção de backdoor?", "Modelos assinados ou com hash verificado no deploy; registro de modelos com controle de acesso e trilha de auditoria; promoção a produção só por pipeline aprovado.", "Registro de modelos, logs de acesso, evidência de verificação de integridade no deploy.", "27001 A.8.32 · AI RMF MEASURE 2.7"]]}, {"k": "6.8", "t": "Saídas sensíveis e injeção", "d": "Cláusula 6 · riscos típicos de modelos generativos e de agentes com ferramentas.", "i": [["6.8", "Saída sensível do modelo", "Há controles para impedir que o modelo exponha dados pessoais, segredos ou o prompt de sistema?", "Segredos nunca colocados em prompts; filtros de saída e DLP; RAG respeitando a permissão do usuário; testes de extração periódicos.", "Configuração de filtros de saída, regras de DLP, testes de extração, arquitetura do RAG.", "27701 A.3.9 · AI RMF MEASURE 2.10"], ["6.9 a", "Injeção de prompt direta", "O sistema resiste a tentativas do usuário de sobrepor as instruções (jailbreak)?", "Separação entre instruções e dados do usuário; guardrails de entrada e saída; conjunto de testes de jailbreak executado a cada mudança de modelo ou de prompt.", "Suíte de testes adversariais, configuração de guardrails, resultados recentes.", "AI RMF MEASURE 2.7"], ["6.9 b", "Injeção de prompt indireta", "Conteúdo externo processado pelo modelo (documentos do RAG, e-mails, páginas web, retornos de ferramentas) é tratado como não confiável?", "Ferramentas do agente com menor privilégio; confirmação humana para ações de impacto (pagamentos, envio de e-mails, alteração de dados); isolamento entre conteúdo externo e instruções.", "Matriz de permissões das ferramentas, fluxos de aprovação humana, testes com conteúdo malicioso.", "AI RMF MAP 3.5 · MANAGE 2.4"], ["6.10", "Saída contendo ataques de injeção", "A saída do modelo é validada antes de ser renderizada ou executada (HTML, SQL, comandos, código)?", "Saída tratada como entrada não confiável: encoding, consultas parametrizadas, validação de esquema, execução de código gerado apenas em sandbox.", "Código de integração, testes de segurança da aplicação, configuração do sandbox.", "27001 A.8.28 · AI RMF MEASURE 2.7"]]}, {"k": "6.11", "t": "Considerações para sistemas de IA", "d": "Cláusula 6.11 · reduzir impacto, controlar o comportamento em operação e garantir proveniência.", "i": [["6.11.2", "Redução de impacto pela limitação de dados", "O sistema usa apenas os dados necessários no treino, no contexto e nas bases de RAG?", "Minimização aplicada; bases de RAG segmentadas por permissão; dados sensíveis removidos ou mascarados antes da indexação.", "Decisões de minimização, configuração das bases de conhecimento, inventário de dados.", "27701 A.1.4.2 · AI RMF MAP 4.1"], ["6.11.3", "Controle do comportamento indesejado em operação", "Há como limitar, interromper ou reverter um sistema de IA que se comporta de forma indesejada em produção?", "Limites de autonomia para agentes; botão de desligamento ou modo degradado; rollback para versão anterior; responsáveis definidos e testados.", "Runbook de contenção, teste de rollback, configuração de limites dos agentes.", "42001 A.6.2.6 · AI RMF MANAGE 2.4"], ["6.11.4", "Proveniência do sistema e dos dados", "É possível rastrear de onde vieram os dados e o modelo, e qual versão gerou cada saída?", "Linhagem de dados registrada; cartões de modelo e de dataset; versão do modelo e do prompt registrada junto das saídas relevantes.", "Model cards, data cards, registros de linhagem, logs com versão do modelo.", "42001 A.7.5 · AI RMF MAP 4.1"]]}, {"k": "7.2", "t": "Mitigações ao longo do ciclo de vida", "d": "Cláusula 7 · interação entre mitigações, continuidade e deterioração ao longo do tempo.", "i": [["7.2", "Conflitos entre mitigações", "Os efeitos combinados das mitigações foram avaliados, inclusive conflitos entre elas e com o desempenho?", "Análise de trade-offs documentada (por exemplo, privacidade diferencial reduzindo acurácia, filtros gerando falsos positivos); decisão aprovada pelo dono do risco.", "Registro de decisões de arquitetura, resultados de testes comparativos.", "AI RMF MANAGE 1.4"], ["7.3", "Continuidade das mitigações no ciclo de vida", "As mitigações são reaplicadas e retestadas após retreino, fine-tuning ou troca do modelo base?", "Testes de regressão de segurança no pipeline; checklist de mudança de modelo; nenhuma versão nova vai a produção sem repetir a bateria de testes.", "Pipeline com etapa de testes de segurança, checklist de liberação, evidências da última troca.", "42001 A.6.2.4 · AI RMF MANAGE 4.2"], ["7.4", "Deterioração do modelo e das mitigações", "Há reavaliação periódica da robustez, já que modelos sofrem drift e surgem novas técnicas de ataque?", "Gatilhos de reavaliação definidos (drift, novo ataque publicado, incidente); calendário de revisão; métricas de robustez acompanhadas ao longo do tempo.", "Calendário de reavaliação, relatórios de drift, histórico de métricas.", "AI RMF MEASURE 3.1"]]}, {"k": "7.5", "t": "Monitoramento, filtragem e limites de uso", "d": "Cláusula 7 · logs, proteção do ambiente de desenvolvimento, filtragem de entradas e throttling.", "i": [["7.5", "Registro e monitoramento", "Prompts, saídas, chamadas de ferramentas e acessos aos modelos são registrados e monitorados, com proteção de privacidade?", "Logs centralizados e integrados ao SIEM; retenção definida; dados pessoais mascarados nos logs; alertas para abuso e anomalias.", "Configuração de logging, casos de uso do SIEM, política de retenção.", "42001 A.6.2.8 · 27001 A.8.15–A.8.16"], ["7.6", "Proteção do ambiente de desenvolvimento", "Notebooks, clusters de treino, registros de modelos e repositórios de dados são protegidos como ambientes críticos?", "Acesso com MFA e menor privilégio; segredos em cofre; isolamento de rede; logs de acesso; dados de produção mascarados no desenvolvimento.", "Configuração do ambiente de ML, cofre de segredos, revisão de acessos.", "27001 A.8.31"], ["7.7.1", "Detecção de entradas fora da distribuição", "O sistema identifica entradas muito diferentes das vistas no treino e as trata com cautela?", "Detector de out-of-distribution ou regras equivalentes; encaminhamento para revisão humana ou resposta de recusa; métricas acompanhadas.", "Configuração do detector, amostras sinalizadas, painel de métricas.", "AI RMF MEASURE 2.4"], ["7.7.2", "Detecção de entradas adversariais", "Há filtros para entradas maliciosas, como classificadores de injeção de prompt ou detectores de perturbação?", "Filtros ativos antes do modelo; taxa de falsos positivos acompanhada; regras atualizadas com base em incidentes e red teaming.", "Configuração dos filtros, relatórios de eficácia, registros de bloqueio.", "AI RMF MEASURE 2.7"], ["7.8", "Limitação de uso do modelo", "Existem cotas e limites de taxa por usuário, chave ou aplicação para conter abuso e extração?", "Limites configurados e revisados; chaves de API individuais; bloqueio automático ou alerta ao exceder padrões.", "Configuração do gateway de API, relatórios de consumo, alertas.", "AI RMF MANAGE 2.2"], ["7.9", "Tamanho e capacidade do modelo", "A escolha do modelo considera a superfície de ataque, evitando capacidades e tamanho além do necessário?", "Avaliação de alternativas menores ou especializadas; capacidades desnecessárias (ferramentas, acesso à internet) desabilitadas.", "Registro da escolha do modelo, configuração de ferramentas habilitadas.", "AI RMF MANAGE 2.1"]]}]}, {"id": "42001", "code": "ISO/IEC 42001:2023", "short": "ISO 42001", "name": "Sistema de gestão de inteligência artificial", "desc": "Requisitos do sistema de gestão de IA (SGIA) nas cláusulas 4 a 10 e controles do Anexo A. Norma certificável.", "color": "#BE185D", "light": "#F9C4DA", "ink": "#9D174D", "steps": [{"k": "4", "t": "Contexto da organização", "d": "Cláusula 4 · contexto, papel em relação à IA, partes interessadas e escopo do SGIA.", "i": [["4.1", "Contexto e papel em relação à IA", "A organização determinou as questões internas e externas relevantes e o seu papel em relação aos sistemas de IA (provedora, produtora, usuária, parceira)?", "Análise de contexto que considera finalidade dos sistemas de IA, regulação aplicável e expectativas da sociedade; papel definido por sistema.", "Documento de contexto, inventário com papel por sistema.", "AI RMF MAP 1.1"], ["4.2", "Partes interessadas", "As partes interessadas relevantes para o SGIA e seus requisitos estão identificados?", "Inclui usuários, pessoas afetadas pelas decisões da IA, reguladores, clientes e fornecedores de modelos.", "Matriz de partes interessadas, registro de requisitos.", "AI RMF GOVERN 1.1 · GOVERN 5.1"], ["4.3", "Escopo do SGIA", "O escopo do SGIA está definido e documentado, com os sistemas de IA cobertos?", "Escopo indica sistemas, processos, unidades e papéis; exclusões justificadas.", "Declaração de escopo aprovada.", "AI RMF GOVERN 1.6 · 27090 5.2 b"], ["4.4", "Processos do SGIA", "O SGIA foi estabelecido como processos que interagem, com responsáveis e indicadores?", "Processos de governança, risco, impacto, ciclo de vida e monitoramento de IA descritos e operando.", "Mapa de processos, procedimentos.", "AI RMF GOVERN 1.4"]]}, {"k": "5", "t": "Liderança", "d": "Cláusula 5 · comprometimento da direção, política de IA e responsabilidades.", "i": [["5.1", "Comprometimento da alta direção", "A alta direção apoia o SGIA com recursos, decisões e integração aos processos de negócio?", "Direção participa de decisões sobre casos de uso de alto risco; recursos aprovados; uso responsável da IA comunicado.", "Atas, orçamento, comunicados.", "AI RMF GOVERN 2.3"], ["5.2", "Política de IA", "Existe política de IA aprovada, que dá estrutura para os objetivos e compromete a organização com requisitos e melhoria contínua?", "Política publicada, alinhada a outras políticas (segurança, privacidade, ética) e revisada periodicamente.", "Política de IA aprovada, registro de divulgação.", "AI RMF GOVERN 1.2 · 27090 5.2 a"], ["5.3", "Papéis e responsabilidades", "Papéis e autoridades do SGIA estão atribuídos e comunicados?", "Responsáveis por governança, risco, impacto, desenvolvimento e operação de IA definidos.", "RACI, atos de nomeação.", "AI RMF GOVERN 2.1"]]}, {"k": "6", "t": "Planejamento", "d": "Cláusula 6 · riscos e oportunidades, avaliação e tratamento de riscos de IA, avaliação de impacto e objetivos.", "i": [["6.1.1", "Riscos e oportunidades do SGIA", "A organização planejou ações para os riscos e oportunidades do SGIA, considerando o uso pretendido dos sistemas de IA?", "Riscos e oportunidades identificados com ações; distinção entre usos pretendidos e usos indevidos previsíveis.", "Registro de riscos e oportunidades.", "AI RMF MAP 1.1"], ["6.1.2", "Avaliação de riscos de IA", "Existe processo de avaliação de riscos de IA, com critérios definidos e resultados consistentes?", "Critérios de risco; identificação considerando consequências para a organização, indivíduos e sociedade; análise e priorização documentadas.", "Metodologia, avaliações de risco por sistema.", "AI RMF MAP 5.1 · MEASURE 1.1 · 27090 5.6"], ["6.1.3", "Tratamento de riscos de IA e Declaração de Aplicabilidade", "Os riscos têm tratamento definido, os controles foram comparados com o Anexo A e existe Declaração de Aplicabilidade?", "SoA com controles, justificativas e status; plano de tratamento e aceite de risco residual pelos responsáveis.", "SoA, plano de tratamento, aceites.", "AI RMF MANAGE 1.3 · MANAGE 1.4"], ["6.1.4", "Avaliação de impacto de sistemas de IA", "Há processo para avaliar as consequências dos sistemas de IA para indivíduos, grupos e sociedade?", "Avaliações feitas para sistemas relevantes, considerando contexto técnico e social; resultados usados na avaliação de riscos.", "Procedimento e avaliações de impacto concluídas.", "AI RMF MAP 3.1 · MAP 3.2 · MAP 5.1"], ["6.2", "Objetivos de IA", "Os objetivos do SGIA são mensuráveis e acompanhados?", "Objetivos com metas, responsáveis, prazos e recursos.", "Plano de objetivos, painel de indicadores.", "AI RMF GOVERN 1.5"], ["6.3", "Planejamento de mudanças", "Mudanças no SGIA são planejadas e controladas?", "Mudanças avaliadas antes de executar, com responsáveis e impactos considerados.", "Registro de mudanças do SGIA.", "AI RMF MANAGE 4.1"]]}, {"k": "7", "t": "Apoio", "d": "Cláusula 7 · recursos, competência, conscientização, comunicação e documentação.", "i": [["7.1", "Recursos", "Os recursos para o SGIA foram determinados e providos?", "Pessoas, dados, ferramentas e infraestrutura compatíveis com os sistemas no escopo.", "Orçamento, quadro de pessoal, contratos.", "AI RMF MANAGE 2.1"], ["7.2", "Competência", "As pessoas que afetam o desempenho da IA têm competência comprovada?", "Requisitos por função (ciência de dados, engenharia, risco, jurídico); lacunas tratadas.", "Matriz de competências, certificados.", "AI RMF GOVERN 2.2"], ["7.3", "Conscientização", "As pessoas conhecem a política de IA e sua contribuição para o SGIA?", "Treinamento sobre uso responsável de IA, inclusive IA generativa no trabalho.", "Registros de treinamento, entrevistas por amostragem.", "AI RMF GOVERN 2.2 · GOVERN 4.1"], ["7.4", "Comunicação", "Está definido o que comunicar sobre o SGIA, para quem, quando e como?", "Plano de comunicação interna e externa sobre IA.", "Plano de comunicação, exemplos.", "AI RMF GOVERN 4.2"], ["7.5", "Informação documentada", "A documentação do SGIA é controlada?", "Versões, aprovações, acesso e retenção definidos.", "Lista mestra, procedimento de controle.", "AI RMF GOVERN 1.4"]]}, {"k": "8", "t": "Operação", "d": "Cláusula 8 · controle operacional, avaliação e tratamento de riscos, avaliação de impacto em operação.", "i": [["8.1", "Planejamento e controle operacional", "Os processos do ciclo de vida da IA são planejados e controlados, inclusive os terceirizados?", "Critérios operacionais; controle de mudanças; processos externos (modelos e dados de terceiros) sob controle.", "Procedimentos, registros, contratos.", "AI RMF MANAGE 1.1"], ["8.2", "Avaliação de riscos de IA realizada", "As avaliações de riscos de IA são repetidas em intervalos planejados e quando há mudanças significativas?", "Reavaliação após troca de modelo, novos dados, novos usos ou incidentes.", "Histórico de avaliações, gatilhos.", "AI RMF MEASURE 3.1 · 27090 7.4"], ["8.3", "Tratamento de riscos de IA implementado", "O plano de tratamento está sendo executado e verificado?", "Ações concluídas com evidência; eficácia acompanhada.", "Status do plano, evidências.", "AI RMF MANAGE 1.3"], ["8.4", "Avaliação de impacto em operação", "As avaliações de impacto são refeitas em intervalos planejados ou quando há mudanças?", "Avaliações atualizadas e registradas.", "Avaliações de impacto revisadas.", "AI RMF MAP 5.1"]]}, {"k": "9", "t": "Avaliação de desempenho", "d": "Cláusula 9 · monitoramento, auditoria interna e análise crítica.", "i": [["9.1", "Monitoramento e medição", "Está definido o que medir no SGIA e nos sistemas de IA, como e com que frequência?", "Indicadores do sistema de gestão e de desempenho dos modelos (qualidade, deriva, incidentes, reclamações).", "Plano de medição, painéis.", "AI RMF MEASURE 2.4 · MANAGE 4.1"], ["9.2", "Auditoria interna", "Existe programa de auditoria interna do SGIA com auditores imparciais?", "Programa cobrindo cláusulas e controles; relatórios; achados tratados.", "Programa, relatórios, plano de ação.", "AI RMF MEASURE 1.3"], ["9.3", "Análise crítica pela direção", "A direção analisa criticamente o SGIA e registra decisões?", "Entradas exigidas consideradas; decisões sobre melhorias e recursos.", "Ata da análise crítica.", "AI RMF GOVERN 1.5"]]}, {"k": "10", "t": "Melhoria", "d": "Cláusula 10 · melhoria contínua, não conformidades e ações corretivas.", "i": [["10.1", "Melhoria contínua", "O SGIA melhora de forma contínua?", "Melhorias registradas a partir de auditorias, incidentes e feedback.", "Registro de melhorias.", "AI RMF MANAGE 4.2"], ["10.2", "Não conformidade e ação corretiva", "Não conformidades e incidentes de IA geram ações corretivas com análise de causa e verificação de eficácia?", "Registro completo de cada não conformidade, causa, ação e eficácia.", "Registro de não conformidades, análises de causa.", "AI RMF MANAGE 4.3"]]}, {"k": "A.2", "t": "Políticas, organização e recursos", "d": "Anexo A · A.2 a A.4 · política, papéis, relato de preocupações e recursos dos sistemas de IA.", "i": [["A.2.2", "Política de IA documentada", "A política de IA está documentada e orienta o desenvolvimento e o uso de sistemas de IA?", "Política cobre princípios, papéis, processos de aprovação e requisitos aplicáveis.", "Política de IA.", "AI RMF GOVERN 1.2"], ["A.2.4", "Revisão da política de IA", "A política de IA é revisada em intervalos planejados ou quando há mudanças?", "Histórico de revisões e responsável pela revisão.", "Controle de versão da política.", "AI RMF GOVERN 1.5"], ["A.3.2", "Papéis e responsabilidades de IA", "Papéis e responsabilidades de IA estão definidos e atribuídos ao longo do ciclo de vida?", "Responsáveis por dados, modelo, validação, implantação, monitoramento e supervisão humana.", "RACI por sistema.", "AI RMF GOVERN 2.1 · 27090 5.2 a"], ["A.3.3", "Relato de preocupações", "Existe canal para que pessoas relatem preocupações sobre o papel da organização em relação a sistemas de IA?", "Canal com confidencialidade, proteção contra retaliação e tratamento registrado.", "Canal, registros de relatos tratados.", "AI RMF GOVERN 4.3 · MEASURE 3.3"], ["A.4.2", "Documentação de recursos", "Os recursos usados em cada sistema de IA estão documentados?", "Componentes, dados, ferramentas, infraestrutura e pessoas por sistema.", "Inventário de recursos por sistema.", "AI RMF GOVERN 1.6 · 27090 5.2 b"], ["A.4.3", "Recursos de dados", "Os dados usados pelos sistemas de IA estão documentados?", "Origem, categorias, finalidade, qualidade e restrições de uso.", "Fichas de dados (data cards), catálogo.", "AI RMF MAP 4.1"]]}, {"k": "A.5", "t": "Avaliação de impacto", "d": "Anexo A · A.5 · processo, documentação e impacto em indivíduos, grupos e sociedade.", "i": [["A.5.2", "Processo de avaliação de impacto", "Existe processo para avaliar os impactos dos sistemas de IA ao longo do ciclo de vida?", "Critérios de quando avaliar, quem participa e como os resultados entram nas decisões.", "Procedimento, calendário de avaliações.", "AI RMF MAP 5.1"], ["A.5.4", "Impacto em indivíduos e grupos", "A avaliação considera impactos em indivíduos e grupos, como equidade, privacidade e segurança física?", "Análise de viés, direitos e danos possíveis; medidas definidas.", "Avaliações de impacto, testes de viés.", "AI RMF MEASURE 2.11"], ["A.5.5", "Impacto social", "A avaliação considera impactos sociais mais amplos dos sistemas de IA?", "Efeitos sobre emprego, informação, meio ambiente e serviços essenciais considerados quando relevantes.", "Avaliações de impacto.", "AI RMF MEASURE 2.12"]]}, {"k": "A.6", "t": "Ciclo de vida do sistema de IA", "d": "Anexo A · A.6 · objetivos de desenvolvimento responsável, requisitos, verificação, implantação, operação e logs.", "i": [["A.6.1.2", "Objetivos de desenvolvimento responsável", "Há objetivos de desenvolvimento responsável que orientam as atividades do ciclo de vida?", "Objetivos (transparência, robustez, equidade, segurança) traduzidos em requisitos de projeto.", "Documento de objetivos, requisitos de projeto.", "AI RMF GOVERN 1.2"], ["A.6.2.2", "Requisitos e especificação", "Os requisitos de novos sistemas de IA ou de mudanças relevantes estão especificados e documentados?", "Requisitos funcionais, de desempenho, segurança e uso responsável, rastreáveis até testes.", "Especificação, matriz de rastreabilidade.", "AI RMF MAP 1.6"], ["A.6.2.4", "Verificação e validação", "Existem medidas de verificação e validação com critérios de aceite definidos?", "Testes com dados representativos, critérios de aceite e aprovação antes da implantação.", "Planos e relatórios de teste.", "AI RMF MEASURE 2.3 · 27090 7.3"], ["A.6.2.5", "Implantação", "A implantação segue um plano com requisitos atendidos antes de entrar em produção?", "Checklist de implantação, aprovação formal e plano de retorno.", "Registro de implantação, aprovação.", "AI RMF MANAGE 1.1"], ["A.6.2.6", "Operação e monitoramento", "Os sistemas de IA são monitorados em operação, com tratamento de falhas e deriva?", "Monitoramento de desempenho, erros e mudanças nos dados; procedimento de contenção.", "Painéis, alertas, registros de incidentes.", "AI RMF MANAGE 4.1 · 27090 6.11.3"], ["A.6.2.8", "Registro de eventos", "Os registros de eventos dos sistemas de IA são habilitados em fases definidas do ciclo de vida?", "Logs suficientes para rastrear entradas, versões e decisões relevantes, com proteção.", "Configuração de logs, amostra de registros.", "27090 7.5"]]}, {"k": "A.7", "t": "Dados e informação para partes", "d": "Anexo A · A.7 e A.8 · qualidade e proveniência dos dados, informação a usuários e comunicação de incidentes.", "i": [["A.7.4", "Qualidade dos dados", "Os requisitos de qualidade dos dados de desenvolvimento e operação estão definidos e verificados?", "Critérios de qualidade, representatividade e validação aplicados.", "Relatórios de qualidade de dados.", "27090 6.2.3 · AI RMF MEASURE 2.1"], ["A.7.5", "Proveniência dos dados", "A proveniência dos dados é registrada ao longo do ciclo de vida?", "Origem, transformações e versões dos dados rastreáveis.", "Registros de linhagem, data cards.", "27090 6.11.4 · AI RMF MAP 4.1"], ["A.8.2", "Informação para usuários", "Os usuários recebem a documentação e as informações necessárias sobre o sistema de IA?", "Limitações, uso pretendido e forma de supervisionar as saídas explicados.", "Manual do usuário, model card.", "AI RMF MAP 2.2"], ["A.8.4", "Comunicação de incidentes", "Há plano para comunicar incidentes de IA a usuários e partes afetadas?", "Critérios, prazos e canais definidos.", "Plano de comunicação de incidentes, registros.", "AI RMF MANAGE 4.3"]]}, {"k": "A.9", "t": "Uso e terceiros", "d": "Anexo A · A.9 e A.10 · uso responsável, uso pretendido, responsabilidades, fornecedores e clientes.", "i": [["A.9.2", "Processos para uso responsável", "Existem processos para o uso responsável dos sistemas de IA?", "Regras de uso, supervisão humana e limites definidos e seguidos.", "Procedimentos de uso, registros de supervisão.", "AI RMF MAP 3.5"], ["A.9.4", "Uso pretendido", "Os sistemas de IA são usados de acordo com o uso pretendido e a documentação?", "Monitoramento de uso fora do previsto; desvios tratados.", "Registros de uso, análises de desvio.", "AI RMF MAP 1.1"], ["A.10.2", "Alocação de responsabilidades", "As responsabilidades entre a organização, parceiros, fornecedores e clientes estão alocadas no ciclo de vida?", "Matriz de responsabilidades compartilhadas refletida em contratos.", "Contratos, matriz de responsabilidades.", "AI RMF GOVERN 6.1"], ["A.10.3", "Fornecedores", "Os serviços, produtos e materiais de fornecedores atendem à abordagem de IA responsável da organização?", "Due diligence e cláusulas sobre uso de dados, segurança e incidentes.", "Avaliações de fornecedores, contratos.", "27090 5.5.5 · AI RMF GOVERN 6.1"], ["A.10.4", "Clientes", "As necessidades e expectativas dos clientes em relação à IA são consideradas?", "Requisitos de clientes registrados e atendidos; transparência sobre uso de IA.", "Contratos, registros de requisitos.", "AI RMF MANAGE 4.1"]]}]}, {"id": "airmf", "code": "NIST AI RMF 1.0", "short": "AI RMF", "name": "Gestão de riscos de IA", "desc": "Framework voluntário do NIST (AI 100-1) com as funções Govern, Map, Measure e Manage. Inclui referências ao perfil de IA generativa (AI 600-1).", "color": "#0E7490", "light": "#A5E4EE", "ink": "#0E7490", "steps": [{"k": "GV1", "t": "Govern · políticas e inventário", "d": "Políticas, requisitos legais, tolerância a risco, inventário e desativação de sistemas de IA.", "i": [["GOVERN 1.1", "Requisitos legais e regulatórios", "Os requisitos legais e regulatórios aplicáveis à IA são conhecidos, gerenciados e documentados?", "Registro de requisitos aplicáveis (LGPD, regulação setorial, AI Act quando houver operação na UE, contratos) com responsável e revisão periódica.", "Registro de requisitos legais, parecer jurídico, matriz de obrigações.", "42001 4.2"], ["GOVERN 1.2", "Características de IA confiável nas políticas", "As políticas incorporam as características de IA confiável: validade, segurança, resiliência, transparência, explicabilidade, privacidade e equidade?", "Política de IA cobre essas características e define como cada uma é avaliada nos projetos.", "Política de IA, padrões de desenvolvimento, checklist de projeto.", "42001 5.2 · A.2.2"], ["GOVERN 1.3", "Nível de gestão de risco proporcional", "Há critérios para definir o rigor da gestão de risco conforme a tolerância a risco e a criticidade de cada sistema?", "Classificação de risco dos sistemas de IA com níveis de controle exigidos por classe.", "Metodologia de classificação, sistemas classificados.", "42001 6.1.2"], ["GOVERN 1.5", "Monitoramento e revisão do processo", "O processo de gestão de riscos de IA é monitorado e revisado periodicamente, com frequência e responsáveis definidos?", "Calendário de revisão, indicadores do processo e responsáveis nomeados.", "Ata de revisão, indicadores, plano anual.", "42001 9.1 · 9.3"], ["GOVERN 1.6", "Inventário de sistemas de IA", "Existem mecanismos para inventariar os sistemas de IA, com recursos proporcionais às prioridades de risco?", "Inventário completo e atualizado, incluindo IA de terceiros e IA generativa usada pelos colaboradores.", "Inventário de IA, procedimento de cadastro, amostra de sistemas.", "42001 A.4.2 · 27090 5.2"], ["GOVERN 1.7", "Desativação segura", "Há processos para desativar sistemas de IA com segurança, sem aumentar riscos nem perder confiança?", "Procedimento de descomissionamento: preservação de registros, descarte de dados e pesos, comunicação aos usuários e substituição planejada.", "Procedimento, registros de sistemas desativados.", "42001 A.6.2.6"]]}, {"k": "GV2", "t": "Govern · pessoas, cultura e terceiros", "d": "Papéis, responsabilidade da liderança, co, com relatório e tratamento dos achados.", "Relatórios de revisão independente, atas.", "42001 9.2 · 27090 5.7 a"], ["MEASURE 2.3", "Desempenho em condições reais", "O desempenho do sistema é medido em condições semelhantes às de implantação?", "Testes com dados representativos do uso real; critérios de aceite atingidos antes do deploy.", "Relatórios de teste, critérios de aceite.", "42001 A.6.2.4"], ["MEASURE 2.6", "Segurança (safety) do sistema", "O sistema é avaliado regularmente quanto a riscos de dano, com limites de falha segura definidos?", "Avaliação de cenários de dano; comportamento seguro em falha; monitoramento contínuo em produção.", "Avaliação de segurança, testes de falha.", "27090 6.11.3"], ["MEASURE 2.7", "Segurança e resiliência", "A segurança e a resiliência do sistema são avaliadas e documentadas, incluindo ataques específicos de IA?", "Testes contra injeção de prompt, envenenamento, evasão e extração; para IA generativa, considerar os riscos do perfil AI 600-1.", "Relatórios de pentest e red team, resultados de testes adversariais.", "27090 6 · 7.7"], ["MEASURE 2.9", "Explicabilidade e documentação do modelo", "O modelo é explicado, validado e documentado, e as saídas são interpretadas no seu contexto?", "Documentação técnica e técnicas de explicação adequadas ao público (usuário, auditor, afetado).", "Model card, relatórios de explicabilidade.", "42001 A.8.2"], ["MEASURE 2.10", "Riscos de privacidade", "Os riscos de privacidade do sistema são examinados e documentados?", "Avaliação de memorização, inferência e vazamento de dados pessoais; base legal e minimização verificadas.", "RIPD, testes de vazamento, avaliação de privacidade.", "27090 6.4 · 6.6 · 6.8 · 27701 A.1.2.6"], ["MEASURE 2.11", "Equidade e viés", "Equidade e viés são avaliados e os resultados documentados?", "Métricas de viés por grupo relevante; limiares definidos; ações quando excedidos.", "Relatório de avaliação de viés, métricas por grupo.", "42001 A.5.4"], ["MEASURE 3.1", " onsáveis para desligar ou substituir sistemas com comportamento inconsistente com o uso pretendido?", "Kill switch ou modo degradado testado; critérios de acionamento definidos.", "Teste de desligamento, runbook.", "27090 6.11.3"], ["MANAGE 3.1", "Monitoramento de terceiros", "Riscos e benefícios de recursos de terceiros são monitorados e os controles aplicados e documentados?", "Revisão periódica de fornecedores de IA e de mudanças em modelos ou termos de uso.", "Relatórios de revisão de fornecedores.", "42001 A.10.3 · 27090 5.5.5"], ["MANAGE 3.2", "Modelos pré-treinados", "Modelos pré-treinados usados no desenvolvimento são monitorados como parte da manutenção regular?", "Acompanhamento de versões, vulnerabilidades e avisos dos modelos base; reavaliação após atualização.", "Registro de modelos base, histórico de atualizações.", "27090 5.5.2"], ["MANAGE 4.1", "Plano de monitoramento pós-implantação", "Há plano de monitoramento pós-implantação com feedback, contestação, desativação, incidentes, recuperação e gestão de mudanças?", "Plano em operação, com indicadores e responsáveis.", "Plano de monitoramento, painel, registros de mudança.", "42001 9.1 · A.6.2.6 · 27090 7.5"], ["MANAGE 4.3", "Comunicação de incidentes e erros", "Incidentes e erros são comunicados às partes relevantes, inclusive comunidades afetadas, e o tratamento é documentado?", "Processo de incidentes de IA integrado à gestão de incidentes, com critérios de comunicação externa.", "Registro de incidentes, comunicações enviadas, lições aprendidas.", "42001 A.8.4 · 10.2"]]}]}], "refs": [["ISO/IEC 27090:2026", "Orientação", "Segurança de sistemas de IA, publicada em outubro de 2026: ameaças como envenenamento de dados, evasão, inferência, exfiltração de modelo e injeção de prompt, com detecção e mitigação. Não é certificável."], ["ISO/IEC 42001:2023", "Certificável", "Sistema de gestão de IA: cláusulas 4 a 10 e controles do Anexo A."], ["NIST AI RMF 1.0", "Framework", "NIST AI 100-1, com as funções Govern, Map, Measure e Manage. Itens de IA generativa remetem ao perfil NIST AI 600-1."]], "notes": ["Funciona sem internet: nada é carregado de fora e nada é enviado. As respostas ficam guardadas neste navegador, separadas por roteiro. Use <b>Exportar backup<\/b> para levar a auditoria para outro computador.", "Cada requisito foi escrito como pergunta de auditoria, com o número da cláusula ou do controle para consulta. O texto não reproduz a norma: confira sempre a publicação oficial.", "Na ISO/IEC 27090 as perguntas seguem as cláusulas 5 a 7. Quando uma cláusula rendeu mais de uma pergunta, o número ganha uma letra, como 6.9 a e 6.9 b.", "As correlações (⇄) apontam requisitos equivalentes em outros referenciais. São um apoio para auditoria integrada, não um mapeamento oficial.", "Roteiro preparado com apoio de IA. Revise perguntas e correlações antes de usar numa auditoria formal."], "hints": {"nome": "Organização Exemplo Ltda.", "auditor": "Jaime — Auditor líder ISO/IEC 42001", "equipe": "Jaime (segurança de IA)", "escopo": "Assistente de atendimento com LLM e RAG, modelo de crédito e plataforma de MLOps, incluindo provedores de API de modelos.", "objetivo": "Verificar a conformidade do SGIA com a ISO/IEC 42001 e a aderência às práticas da ISO/IEC 27090 e do NIST AI RMF."}, "terms": {"maj": "Requisito ausente, falha que se repete ou risco relevante para pessoas afetadas pela IA. Na ISO/IEC 42001 bloqueia a certificação; na ISO/IEC 27090 e no AI RMF indica distância grande da prática esperada.", "majShort": "bloqueiam certificação", "majRec": "Até a correção, avalie se o sistema de IA afetado deve operar com restrições.", "keep": "Repetir a avaliação de riscos e o red teaming sempre que modelo, dados ou uso mudarem, e preparar a certificação ISO/IEC 42001.", "conclMaj": "Há não conformidades maiores. Elas precisam ser resolvidas antes de buscar a certificação ISO/IEC 42001 e antes de ampliar o uso dos sistemas de IA avaliados.", "conclNo": "Nenhuma não conformidade maior foi encontrada. Os pontos restantes podem ser tratados no ciclo normal de melhoria.", "high": "Governança e segurança de IA funcionam de forma consistente. Restam ajustes pontuais.", "mid": "A estrutura existe, mas há lacunas a fechar antes da certificação ou da expansão do uso de IA.", "part": "Muitos requisitos ainda estão incompletos. Vale montar um plano de ação com prazos e donos.", "low": "A gestão de IA ainda não está de pé. Comece pelo inventário de sistemas, pela política e pela avaliação de riscos."}, "demo": {"nome": "Organização Exemplo Ltda.", "auditor": "Jaime — Auditor líder ISO/IEC 42001", "equipe": "Jaime (segurança de IA)", "escopo": "Assistente de atendimento com LLM e RAG, modelo de crédito e plataforma de MLOps, incluindo provedores de API de modelos.", "objetivo": "Verificar a conformidade do SGIA com a ISO/IEC 42001 e a aderência às práticas da ISO/IEC 27090 e do NIST AI RMF.", "people": ["Jaime — Gerente de Infraestrutura", "Jaime — Coordenador de GRC", "Jaime — Analista de Segurança", "Jaime — Encarregado de Dados", "Jaime — Líder de Engenharia", "Jaime — Líder de Ciência de Dados"]}}</script>
<script>
(function(){
'use strict';
var DECK = JSON.parse(document.getElementById('deck-data').textContent);
var KEY = 'quality-audit-' + DECK.id + '-v1';
var NORMS = DECK.norms;
var TM = DECK.terms;
var ST = {
  C:{l:'Conforme', s:'C', c:'#15803D', b:'#DCFCE7', v:1},
  P:{l:'Parcial', s:'P', c:'#B45309', b:'#FEF3C7', v:0.5},
  NC:{l:'Não conforme', s:'NC', c:'#B91C1C', b:'#FEE2E2', v:0},
  NA:{l:'Não aplicável', s:'N/A', c:'#475569', b:'#E2E8F0'}
};
var MAT = ['Inexistente','Inicial','Repetível','Definido','Gerenciado','Otimizado'];
var MATD = [
  'Nada implantado ou sem qualquer evidência.',
  'Feito de forma informal, dependente de pessoas específicas.',
  'Repetido na prática, mas sem documentação suficiente.',
  'Documentado, aprovado e aplicado de forma padronizada.',
  'Medido com indicadores e acompanhado pela gestão.',
  'Melhorado de forma contínua a partir dos resultados.'
];
var LOGO = '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#14B8A6"/><circle cx="11.5" cy="11.5" r="5.6" fill="none" stroke="#032A2C" stroke-width="2.4"/><path d="M15.6 15.6l4.6 4.6" stroke="#032A2C" stroke-width="2.6" stroke-linecap="round"/><path d="M9 11.6l1.8 1.8 3.4-3.6" fill="none" stroke="#032A2C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function blank(){
  return {view:'home', norms:NORMS.map(function(n){return n.id;}),
    org:{nome:'', escopo:'', objetivo:'', auditor:'', equipe:'', inicio:'', fim:'', metodo:'Entrevistas, análise documental e verificação de evidências por amostragem.'},
    ans:{}, si:0, filter:'all', rep:'exec', dash:'exec', pf:'all'};
}
function load(){
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (d && d.org) { var b = blank(); Object.assign(b, d); b.org = Object.assign(blank().org, d.org); b.ans = d.ans || {}; return b; }
  } catch(e) {}
  return blank();
}
var S = load();
var guideOpen = {}, confirmReset = false, scrollTo = null;
var saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(function(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }, 120); }

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pct(x){ return x == null ? '—' : x + '%'; }
function today(){ var d = new Date(); return d.toISOString().slice(0,10); }
function fmt(iso){ if (!iso) return '—'; var p = iso.split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function nById(id){ for (var i = 0; i < NORMS.length; i++) if (NORMS[i].id === id) return NORMS[i]; return null; }
function sel(){ var s = NORMS.filter(function(n){ return S.norms.indexOf(n.id) >= 0; }); return s.length ? s : NORMS; }
function itemObj(n, st, it){ return {n:n, st:st, ref:it[0], t:it[1], q:it[2], o:it[3], e:it[4], map:it[5] || '', key:n.id + '|' + it[0]}; }
function steps(){
  var out = [];
  sel().forEach(function(n){ n.steps.forEach(function(st){ out.push({n:n, st:st, items:st.i.map(function(it){ return itemObj(n, st, it); })}); }); });
  return out;
}
function allItems(){ var a = []; steps().forEach(function(s){ a = a.concat(s.items); }); return a; }
function A(k){ return S.ans[k] || {}; }
function setA(k, patch){ var a = Object.assign({}, S.ans[k] || {}, patch); Object.keys(a).forEach(function(x){ if (a[x] === undefined) delete a[x]; }); S.ans[k] = a; save(); }
function stats(items){
  var c = {C:0, P:0, NC:0, NA:0, maj:0, men:0, pend:0, total:items.length, sum:0, ev:0, matS:0, matN:0};
  items.forEach(function(it){
    var a = A(it.key);
    if (typeof a.mat === 'number') { c.matS += a.mat; c.matN++; }
    if (!a.st) { c.pend++; return; }
    c[a.st]++;
    if (a.st === 'NC') { if (a.sev === 'maior') c.maj++; else c.men++; }
    if (a.st !== 'NA') { c.ev++; c.sum += ST[a.st].v; }
  });
  c.done = c.total - c.pend;
  c.score = c.ev ? Math.round(c.sum / c.ev * 100) : null;
  c.mat = c.matN ? Math.round(c.matS / c.matN * 10) / 10 : null;
  return c;
}
function band(sc){
  if (sc == null) return {bg:'#E2E8F0', fg:'#334155', bar:'#CBD5DF'};
  if (sc >= 85) return {bg:'#15803D', fg:'#fff', bar:'#15803D'};
  if (sc >= 70) return {bg:'#0E7490', fg:'#fff', bar:'#0E7490'};
  if (sc >= 50) return {bg:'#D97706', fg:'#fff', bar:'#D97706'};
  return {bg:'#B91C1C', fg:'#fff', bar:'#B91C1C'};
}
function verdict(sc){
  if (sc == null) return {t:'Sem dados', d:'Avalie os requisitos para gerar o resultado.', c:'#475569'};
  if (sc >= 85) return {t:'Consistente', d:TM.high, c:'#15803D'};
  if (sc >= 70) return {t:'Em consolidação', d:TM.mid, c:'#0E7490'};
  if (sc >= 50) return {t:'Parcial', d:TM.part, c:'#B45309'};
  return {t:'Inicial', d:TM.low, c:'#B91C1C'};
}
function findings(){
  return allItems().filter(function(it){ var s = A(it.key).st; return s === 'NC' || s === 'P'; }).map(function(it){
    var a = A(it.key);
    var type = a.st === 'NC' ? (a.sev === 'maior' ? 'NC maior' : 'NC menor') : 'Parcial';
    return Object.assign({}, it, {a:a, type:type, rank: type === 'NC maior' ? 0 : type === 'NC menor' ? 1 : 2, cls: type === 'NC maior' ? 't-maj' : type === 'NC menor' ? 't-men' : 't-par'});
  }).sort(function(x, y){ return x.rank - y.rank; });
}
function rfStyle(n){ return 'background:' + n.light + '55;color:' + n.ink; }
function ring(score, size){
  size = size || 132; var r = size / 2 - 10, C = 2 * Math.PI * r, v = score == null ? 0 : score;
  var col = band(score).bar;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Índice ' + pct(score) + '">' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="#EDF2F5" stroke-width="12"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (C * v / 100) + ' ' + C + '" transform="rotate(-90 ' + size/2 + ' ' + size/2 + ')"/>' +
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="' + Math.round(size/4.2) + '" font-weight="800" fill="#0B1B2B">' + (score == null ? '—' : score) + '</text></svg>';
}

/* ---------- topo ---------- */
function header(){
  var it = allItems(), s = stats(it), p = s.total ? Math.round(s.done / s.total * 100) : 0;
  var tabs = [['home','Início'],['audit','Auditoria'],['plan','Plano de ação'],['dash','Painel'],['rep','Relatórios']];
  return '<header class="top"><div class="top-in">' +
    '<button class="brand" data-act="nav" data-v="home">' + LOGO + '<b>Quality &amp; Audit</b><i>' + esc(DECK.tag) + '</i></button>' +
    '<nav class="nav">' + tabs.map(function(t){ return '<button data-act="nav" data-v="' + t[0] + '" class="' + (S.view === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</nav>' +
    '<div class="prog"><div class="bar"><span style="width:' + p + '%"></span></div><span><b>' + s.done + '</b> de ' + s.total + ' avaliados</span></div>' +
    '</div></header>';
}

/* ---------- início ---------- */
function vHome(){
  var it = allItems(), s = stats(it), st = steps();
  var H = DECK.hints || {};
  function fld(k, label, hint, wide, type){
    var val = esc(S.org[k] || ''), ph = H[k] ? ' placeholder="Ex.: ' + esc(H[k]) + '"' : '';
    var input = type === 'area' ? '<textarea data-org="' + k + '"' + ph + '>' + val + '</textarea>' :
      '<input type="' + (type || 'text') + '" data-org="' + k + '" value="' + val + '"' + ph + '>';
    return '<label class="f' + (wide ? ' wide' : '') + '">' + label + input + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
  }
  var normCards = NORMS.map(function(n){

  var refs = DECK.refs.map(function(r){ return '<div class="ref"><div class="t"><b>' + esc(r[0]) + '</b><span class="pill">' + esc(r[1]) + '</span></div><span class="d">' + esc(r[2]) + '</span></div>'; }).join('');
  var notes = DECK.notes.map(function(n){ return '<p>' + n + '</p>'; }).join('');
  var reset = confirmReset ?
    '<span style="font-weight:700;color:var(--nc)">Apagar todas as respostas deste roteiro?</span><button class="btn btn-red btn-sm" data-act="resetYes">Sim, apagar</button><button class="btn btn-sec btn-sm" data-act="resetNo">Cancelar</button>' :

  return '<section class="hero"><div class="hero-in"><div>' +

    '</div><div class="hero-card">' +

    '<div class="wrap">' +

      fld('nome', 'Organização auditada', 'Nome que vai aparecer nos relatórios.') +
      fld('auditor', 'Auditor líder', 'Quem conduz e assina o relatório.') +
